<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Photobooth Siap Simpan & Cetak</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .mirror {
            transform: scaleX(-1);
        }

        /* Styling untuk area foto yang bisa digeser (pan/drag) */
        .draggable-photo-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            overflow: hidden;
            border-radius: 0.375rem;
            border: 1px solid #fde68a;
            background-color: #000;
            cursor: grab;
            touch-action: none;
        }

        .draggable-photo-container:active {
            cursor: grabbing;
        }

        .draggable-photo-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            pointer-events: none;
        }

        /* PENGATURAN KHUSUS UNTUK PRINT / CETAK */
        @media print {
            body * {
                visibility: hidden;
            }
            #photostrip-template, #photostrip-template * {
                visibility: visible;
            }
            #photostrip-template {
                position: fixed;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 50mm;
                box-shadow: none !important;
                border: 1px solid #e2e8f0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            @page {
                size: auto;
                margin: 0mm;
            }
        }
    </style>
</head>
<body class="bg-red-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-red-900 rounded-3xl shadow-2xl p-6 text-center border border-slate-800">
        <h1 class="text-2xl font-bold mb-1 text-pink-400">📸 Studio Photobooth</h1>
        <p id="instruction-text" class="text-slate-300 text-sm mb-3">Pilih pose terbaikmu, siap simpan & cetak!</p>

        <!-- Tombol Ganti Kamera (Depan / Belakang) -->
        <button id="switch-camera-btn" onclick="switchCamera()" class="mb-3 py-1.5 px-4 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition-all cursor-pointer inline-flex items-center gap-1.5">
            🔄 Putar Kamera (<span id="cam-status">Depan</span>)
        </button>

        <!-- Area Kamera / Live Preview (Wide Mode) -->
        <div id="camera-container" class="relative rounded-2xl overflow-hidden bg-black aspect-[4/3] flex items-center justify-center border-4 border-slate-700 mb-5 shadow-inner">
            <video id="video" autoplay playsinline class="w-full h-full object-cover mirror"></video>
            
            <!-- Tempat Pratinjau Kilat Foto -->
            <img id="snapshot-preview" class="absolute inset-0 w-full h-full object-cover hidden" alt="Preview Foto">

            <!-- Tampilan Status / Hitung Mundur / Jeda -->
            <div id="status-display" class="absolute text-8xl font-black text-yellow-400 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] hidden">3</div>
        </div>

        <!-- Tombol Mulai -->
        <button id="start-btn" onclick="startPhotoSession()" class="w-full py-3.5 px-6 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 font-bold rounded-xl text-lg transition-all shadow-lg shadow-pink-900/30 cursor-pointer">
            Mulai Foto (3 Pose)
        </button>

        <!-- Area Hasil Template Photostrip dengan Background Cetak Berwarna -->
        <div id="result-container" class="hidden mt-2 flex flex-col items-center">
            <h2 class="text-sm font-semibold mb-2 text-green-300">✨ Geser posisi foto jika perlu, lalu simpan!</h2>
            
            <!-- TEMPLATE PHOTOPRINT -->
            <div id="photostrip-template" class="bg-amber-50 text-slate-900 p-3 rounded-xl shadow-2xl flex flex-col items-center gap-2 w-56 border-2 border-amber-200 relative overflow-hidden">
                
                <!-- Ornamen Background Hiasan Pojok & Pelangi/Bintang Samping -->
                <div class="absolute -top-6 -left-6 w-16 h-16 bg-pink-200 rounded-full opacity-60 pointer-events-none"></div>
                <div class="absolute -bottom-6 -right-6 w-16 h-16 bg-purple-200 rounded-full opacity-60 pointer-events-none"></div>
                
                <!-- Ornamen Sisi Kiri (Pelangi & Bintang) -->
                <div class="absolute left-1 top-1/4 text-xs opacity-80 pointer-events-none flex flex-col gap-10">
                    <span>🌈</span><span>⭐</span><span>🌈</span>
                </div>
                <!-- Ornamen Sisi Kanan (Bintang & Pelangi) -->
                <div class="absolute right-1 top-1/4 text-xs opacity-80 pointer-events-none flex flex-col gap-10">
                    <span>⭐</span><span>🌈</span><span>⭐</span>
                </div>

                <!-- Judul / Frame Header dengan Ornamen Bintang -->
                <div class="text-center z-10">
                    <div class="text-pink-600 text-[10px] font-bold tracking-widest">★ PHOTOBOOTH ★</div>
                    <h3 class="font-black tracking-wider text-sm uppercase text-slate-800">Orlando Studio</h3>
                    <p id="date-stamp" class="text-[9px] text-slate-500 font-medium"></p>
                </div>

                <!-- Wadah 3 Foto Berjajar Vertikal -->
                <div id="strip-photos" class="flex flex-col gap-1.5 w-full z-10">
                    <!-- Foto interaktif dimasukkan lewat JS -->
                </div>

                <!-- Footer Template dengan Ornamen Love -->
                <div class="text-center z-10 mt-0.5">
                    <div class="text-[9px] font-bold text-slate-600 tracking-widest uppercase">
                        ⚡ Moments ⚡
                    </div>
                    <div class="text-pink-600 text-[9px]">♥ ♥ ♥</div>
                </div>
            </div>

            <!-- Tombol Aksi Setelah Jadi (Simpan, Ulang, Cetak) -->
            <div class="flex flex-col gap-2 w-full mt-5">
                <button onclick="downloadPhotostrip()" class="w-full py-2.5 bg-green-600 hover:bg-green-500 font-semibold rounded-xl text-sm transition-all shadow-md cursor-pointer flex items-center justify-center gap-2">
                    📥 Simpan ke Galeri
                </button>
                <div class="flex gap-2 w-full">
                    <button onclick="resetApp()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 font-semibold rounded-xl text-xs transition-all border border-slate-700 cursor-pointer">
                        🔄 Ulang
                    </button>
                    <button onclick="window.print()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 font-semibold rounded-xl text-xs transition-all shadow-md cursor-pointer">
                        🖨️ Cetak
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Canvas Tersembunyi -->
    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('start-btn');
        const statusDisplay = document.getElementById('status-display');
        const snapshotPreview = document.getElementById('snapshot-preview');
        const instructionText = document.getElementById('instruction-text');
        const resultContainer = document.getElementById('result-container');
        const cameraContainer = document.getElementById('camera-container');
        const stripPhotos = document.getElementById('strip-photos');
        const dateStamp = document.getElementById('date-stamp');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const camStatus = document.getElementById('cam-status');

        let currentFacingMode = "user"; 
        let currentStream = null;
        let photos = [];

        async function initCamera(facingMode) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: { 
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 }, 
                        facingMode: facingMode 
                    }, 
                    audio: false 
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                video.srcObject = stream;

                if (facingMode === "environment") {
                    video.classList.remove('mirror');
                    camStatus.innerText = "Belakang";
                } else {
                    video.classList.add('mirror');
                    camStatus.innerText = "Depan";
                }
            } catch (err) {
                alert("Gagal mengakses kamera! Pastikan izin kamera diaktifkan.");
                console.error(err);
            }
        }

        initCamera(currentFacingMode);

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            initCamera(currentFacingMode);
        }

        async function startPhotoSession() {
            startBtn.classList.add('hidden');
            document.getElementById('switch-camera-btn').classList.add('hidden');
            photos = [];
            stripPhotos.innerHTML = '';

            for (let i = 1; i <= 3; i++) {
                instructionText.innerText = `Bersiap untuk Foto ke-${i} dari 3...`;
                
                await runCountdown();
                const photoData = takeSnapshot();
                photos.push(photoData);

                await showQuickPreview(photoData);

                if (i < 3) {
                    await runDelay(2);
                }
            }

            showResults();
        }

        function runCountdown() {
            return new Promise((resolve) => {
                let count = 3;
                statusDisplay.innerText = count;
                statusDisplay.classList.remove('hidden');

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        statusDisplay.innerText = count;
                    } else {
                        clearInterval(timer);
                        statusDisplay.classList.add('hidden');
                        resolve();
                    }
                }, 1000);
            });
        }

        function takeSnapshot() {
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            
            if (currentFacingMode === "user") {
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
            }
            
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            context.setTransform(1, 0, 0, 1, 0, 0);
            
            return dataUrl;
        }

        function showQuickPreview(photoSrc) {
            return new Promise((resolve) => {
                snapshotPreview.src = photoSrc;
                snapshotPreview.classList.remove('hidden');
                instructionText.innerText = "✨ Bagus! Pose tersimpan.";

                setTimeout(() => {
                    snapshotPreview.classList.add('hidden');
                    resolve();
                }, 1500);
            });
        }

        function runDelay(seconds) {
            return new Promise((resolve) => {
                let currentSec = seconds;
                instructionText.innerText = `Ganti gaya! Jeda ${currentSec} detik...`;
                statusDisplay.innerText = currentSec;
                statusDisplay.classList.add('hidden');
                statusDisplay.classList.add('text-6xl', 'text-cyan-400');

                const delayTimer = setInterval(() => {
                    currentSec--;
                    if (currentSec > 0) {
                        statusDisplay.innerText = currentSec;
                        instructionText.innerText = `Ganti gaya! Jeda ${currentSec} detik...`;
                    } else {
                        clearInterval(delayTimer);
                        statusDisplay.classList.add('hidden');
                        statusDisplay.classList.remove('text-6xl', 'text-cyan-400');
                        resolve();
                    }
                }, 1000);
            });
        }

        function showResults() {
            cameraContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            instructionText.innerText = "Selesai! Geser foto jika perlu lalu simpan/cetak.";

            const now = new Date();
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            dateStamp.innerText = now.toLocaleDateString('id-ID', options);

            photos.forEach((photoSrc) => {
                const container = document.createElement('div');
                container.className = "draggable-photo-container";

                const img = document.createElement('img');
                img.src = photoSrc;
                
                container.appendChild(img);
                stripPhotos.appendChild(container);

                let isDragging = false;
                let startX = 0, startY = 0;
                let currentX = 0, currentY = 0;

                function dragStart(e) {
                    isDragging = true;
                    startX = (e.type === 'touchstart') ? e.touches[0].clientX : e.clientX;
                    startY = (e.type === 'touchstart') ? e.touches[0].clientY : e.clientY;
                }

                function dragMove(e) {
                    if (!isDragging) return;
                    let clientX = (e.type === 'touchmove') ? e.touches[0].clientX : e.clientX;
                    let clientY = (e.type === 'touchmove') ? e.touches[0].clientY : e.clientY;
                    
                    let dx = clientX - startX;
                    let dy = clientY - startY;

                    currentX += dx;
                    currentY += dy;

                    startX = clientX;
                    startY = clientY;

                    img.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.15)`;
                }

                function dragEnd() {
                    isDragging = false;
                }

                container.addEventListener('mousedown', dragStart);
                window.addEventListener('mousemove', dragMove);
                window.addEventListener('mouseup', dragEnd);

                container.addEventListener('touchstart', dragStart);
                window.addEventListener('touchmove', dragMove);
                window.addEventListener('touchend', dragEnd);
            });
        }

        // Fungsi Download Canvas API (Dengan Ornamen Pelangi 🌈 & Bintang ⭐ di Hasil Gambar)
        function downloadPhotostrip() {
            const stripTemplate = document.getElementById('photostrip-template');
            
            const finalCanvas = document.createElement('canvas');
            const ctx = finalCanvas.getContext('2d');
            
            finalCanvas.width = 900;
            finalCanvas.height = 2400;
            
            // Background warna kertas (Krem / Amber lembut)
            ctx.fillStyle = "#fffbeb";
            ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
            
            // --- MENGGAMBAR ORNAMEN PELANGI & BINTANG DI SISI KIRI & KANAN ---
            ctx.font = "bold 32px sans-serif";
            ctx.textAlign = "center";
            
            // Sisi Kiri (Pelangi & Bintang bergantian)
            ctx.fillText("🌈", 70, 800);
            ctx.fillText("⭐", 70, 1200);
            ctx.fillText("🌈", 70, 1600);
            
            // Sisi Kanan (Bintang & Pelangi bergantian)
            ctx.fillText("⭐", finalCanvas.width - 70, 800);
            ctx.fillText("🌈", finalCanvas.width - 70, 1200);
            ctx.fillText("⭐", finalCanvas.width - 70, 1600);
            
            // Header Teks
            ctx.fillStyle = "#db2777";
            ctx.font = "bold 30px sans-serif";
            ctx.fillText("★ PHOTOBOOTH ★", finalCanvas.width / 2, 130);
            
            ctx.fillStyle = "#1e293b";
            ctx.font = "900 46px sans-serif";
            ctx.fillText("ORLANDO STUDIO", finalCanvas.width / 2, 195);
            
            ctx.fillStyle = "#64748b";
            ctx.font = "24px sans-serif";
            ctx.fillText(dateStamp.innerText, finalCanvas.width / 2, 245);
            
            const imgContainers = stripTemplate.querySelectorAll('.draggable-photo-container img');
            
            let loadedImages = 0;
            const totalImages = imgContainers.length;
            
            if (totalImages === 0) {
                alert("Belum ada foto untuk didownload!");
                return;
            }

            const photoWidth = 760;
            const photoHeight = 570;
            const startY = 310;
            const gap = 55;

            imgContainers.forEach((imgEl, index) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = imgEl.src;
                
                img.onload = function() {
                    ctx.save();
                    const currentY = startY + (index * (photoHeight + gap));
                    const photoX = (finalCanvas.width - photoWidth) / 2;
                    
                    ctx.beginPath();
                    ctx.rect(photoX, currentY, photoWidth, photoHeight);
                    ctx.clip();
                    
                    ctx.drawImage(img, photoX, currentY, photoWidth, photoHeight);
                    ctx.restore();
                    
                    loadedImages++;
                    
                    if (loadedImages === totalImages) {
                        drawFooterAndDownload();
                    }
                };
            });

            function drawFooterAndDownload() {
                const footerY = startY + (totalImages * (photoHeight + gap)) + 40;
                
                ctx.fillStyle = "#475569";
                ctx.font = "bold 28px sans-serif";
                ctx.fillText("⚡ MOMENTS ⚡", finalCanvas.width / 2, footerY);
                
                ctx.fillStyle = "#db2777";
                ctx.font = "28px sans-serif";
                ctx.fillText("♥ ♥ ♥", finalCanvas.width / 2, footerY + 45);
                
                const imageURL = finalCanvas.toDataURL('image/jpeg', 0.95);
                const imageLink = document.createElement('a');
                imageLink.href = imageURL;
                imageLink.download = `Photostrip-Orlando-${Date.now()}.jpg`;
                
                document.body.appendChild(imageLink);
                imageLink.click();
                document.body.removeChild(imageLink);
            }
        }

        function resetApp() {
            resultContainer.classList.add('hidden');
            cameraContainer.classList.remove('hidden');
            startBtn.classList.remove('hidden');
            document.getElementById('switch-camera-btn').classList.remove('hidden');
            instructionText.innerText = "Pilih pose terbaikmu, siap simpan & cetak!";
            photos = [];
            initCamera(currentFacingMode);
        }
    </script>
</body>
</html>
